<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Crypto Pro Trade – GLM 5.2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#0e1117;--panel:#141820;--surf:#1b2030;--border:#232b3e;
  --text:#c8d0e0;--t2:#6b7a9a;--t3:#3a4560;
  --up:#26a69a;--dn:#ef5350;--acc:#00bcd4;--acc-bg:#003840;
  --nav:42px;--wl:238px;--ob:196px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
          font-family:'Inter',system-ui,sans-serif;font-size:12px;overflow:hidden}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
input,button,select{font-family:inherit;outline:none;border:none}
button{cursor:pointer;background:transparent}

/* ── NAV ────────── */
#nav{height:var(--nav);background:var(--panel);border-bottom:1px solid var(--border);
     display:flex;align-items:center;padding:0 14px;gap:20px;flex-shrink:0}
.n-logo{width:26px;height:26px;background:var(--acc);border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        font-size:10px;font-weight:800;color:#000;flex-shrink:0}
.n-lnk{display:flex;gap:20px}
.n-lnk a{font-size:12px;color:var(--t2);cursor:pointer;
          padding-bottom:2px;border-bottom:2px solid transparent}
.n-lnk a.on{color:var(--text);border-bottom-color:var(--acc)}
.n-r{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--t2);font-size:12px}
.nav-av{width:22px;height:22px;background:var(--surf);border-radius:50%}

/* ── LAYOUT ──────── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#main{display:flex;flex:1;min-height:0;overflow:hidden}

/* ── WATCHLIST ───── */
#wl{width:var(--wl);background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#wl-hd{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;
       border-bottom:1px solid var(--border);flex-shrink:0}
#wl-hd span{font-weight:700;font-size:13px}
#wl-hd button{color:var(--t2);font-size:15px}
#wl-sc{padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
#wl-sc input{width:100%;background:var(--surf);border:1px solid var(--border);border-radius:4px;
             padding:5px 8px 5px 26px;color:var(--text);font-size:11px}
#wl-sc::before{content:"⌕";position:absolute;left:17px;top:50%;transform:translateY(-50%);
               color:var(--t3);font-size:14px;pointer-events:none}
#wl-sc input::placeholder{color:var(--t3)}
#wl-ch{display:grid;grid-template-columns:1fr auto;padding:3px 12px;
       font-size:10px;color:var(--t3);border-bottom:1px solid var(--border);flex-shrink:0}
#wl-ls{flex:1;overflow:auto}
.wi{display:flex;align-items:center;padding:6px 10px 6px 12px;cursor:pointer;
    border-bottom:1px solid rgba(35,43,62,.3);gap:6px;
    border-left:2px solid transparent;transition:background .15s}
.wi:hover{background:rgba(255,255,255,.02)}
.wi.on{background:rgba(0,188,212,.05);border-left-color:var(--acc)}
.wi-inf{flex:1;min-width:0}
.wi-s{font-weight:700;font-size:12px}
.wi-n{font-size:10px;color:var(--t3);margin-top:1px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi-mn{flex-shrink:0}
.wi-pr{text-align:right;flex-shrink:0;min-width:54px}
.wi-pv{font-size:12px;font-weight:600;margin-bottom:1px}
.wi-cv{font-size:10px}

/* ── CHART AREA ──── */
#cta{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#ct-hd{background:var(--panel);border-bottom:1px solid var(--border);padding:0 12px;
       display:flex;align-items:center;gap:8px;flex-shrink:0;height:40px}
#pbadge{background:var(--acc-bg);border:1px solid #005060;color:var(--acc);
        font-size:13px;font-weight:800;padding:2px 9px;border-radius:3px;flex-shrink:0}
#ppill{background:var(--surf);border:1px solid var(--border);color:var(--t2);
       font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600}
#ohlcv{display:flex;gap:6px;font-size:10px;color:var(--t2)}
#ohlcv b{font-weight:600}
#ct-hdr{margin-left:auto;display:flex;align-items:center;gap:6px}
#live{display:flex;align-items:center;gap:3px;font-size:9px}
#ldot{width:5px;height:5px;border-radius:50%;background:var(--t3);flex-shrink:0}
#ltxt{color:var(--t3)}
.btb{padding:3px 8px;border:1px solid var(--border);color:var(--t2);
     font-size:10px;border-radius:3px;transition:all .15s}
.btb.on{background:var(--surf);color:var(--text)}

/* ── CHART BODY ──── */
#ctb{flex:1;display:flex;min-height:0;overflow:hidden}
#dt{width:34px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;padding:6px 0;
    gap:2px;flex-shrink:0;overflow:hidden}
.db{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    border-radius:3px;color:var(--t3);font-size:12px;transition:all .15s}
.db:hover{background:var(--surf);color:var(--t2)}
.dsep{width:18px;height:1px;background:var(--border);flex-shrink:0;margin:2px 0}
#cw{flex:1;position:relative;overflow:hidden;min-width:0}
#mc{position:absolute;top:0;left:0;right:0}
#rsic{position:absolute;left:0;right:0;border-top:1px solid var(--border)}
#rsil{position:absolute;top:4px;left:44px;font-size:9px;color:var(--t2);z-index:5;pointer-events:none}

/* ── TF BAR ──────── */
#tfb{background:var(--panel);border-top:1px solid var(--border);
     display:flex;align-items:center;gap:2px;padding:3px 10px;
     flex-shrink:0;height:30px}
.tf{padding:2px 7px;border-radius:3px;color:var(--t2);font-size:11px;
    cursor:pointer;transition:all .15s;border:1px solid transparent}
.tf.on{background:var(--surf);color:var(--text);border-color:var(--border)}
.tf:hover{color:var(--text)}
#tfts{margin-left:auto;font-size:9px;color:var(--t3)}

/* ── ORDER BOOK ──── */
#ob{width:var(--ob);background:var(--panel);border-left:1px solid var(--border);
    display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#ob-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.ot{flex:1;padding:9px 4px;text-align:center;color:var(--t2);
    font-size:11px;border-bottom:2px solid transparent;transition:all .15s}
.ot.on{color:var(--text);border-bottom-color:var(--acc)}
/* depth */
#ob-dep{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.ob-ch{display:grid;grid-template-columns:1fr auto;padding:3px 8px;
       font-size:9px;color:var(--t3);text-transform:uppercase;
       border-bottom:1px solid var(--border);flex-shrink:0}
#ob-al{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#ob-mid{padding:5px 8px;background:var(--surf);border-top:1px solid var(--border);
        border-bottom:1px solid var(--border);text-align:center;flex-shrink:0}
#oblp{font-size:13px;font-weight:800}
#ob-bl{flex:1;overflow:hidden;display:flex;flex-direction:column}
.ob-r{position:relative;display:grid;grid-template-columns:1fr auto;padding:1.5px 8px}
.ob-bg{position:absolute;top:0;bottom:0;right:0;opacity:.1}
.ob-p{font-size:11px;font-weight:500}
.ob-q{font-size:10px;color:var(--t3)}
/* order entry */
#ob-ord{display:none;padding:10px;overflow:auto;flex:1;flex-direction:column;gap:8px}
.oe-s{flex:1;padding:7px;border-radius:3px;font-weight:700;font-size:11px;
      text-transform:uppercase;border:1px solid var(--border);
      background:var(--surf);color:var(--t2);transition:all .15s}
.buy-a{background:#062b1a!important;color:var(--up)!important;border-color:var(--up)!important}
.sel-a{background:#2e0a0a!important;color:var(--dn)!important;border-color:var(--dn)!important}
.oe-lbl{font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;
        display:block;margin-bottom:3px}
.oe-inp{width:100%;background:var(--surf);border:1px solid var(--border);
        border-radius:3px;padding:6px 7px;color:var(--text);font-size:11px}
.oe-inp:focus{border-color:var(--acc)}
/* asks only */
#ob-ask{display:none;flex-direction:column;flex:1;overflow:hidden}

/* ── MOBILE ──────── */
#mob{display:none;position:fixed;bottom:0;left:0;right:0;height:46px;
     background:var(--panel);border-top:1px solid var(--border);z-index:100}
.mbt{flex:1;color:var(--t2);font-size:10px;font-weight:600;height:100%}
.mbt.on{color:var(--acc)}
@media(max-width:760px){
  #wl,#ob{display:none}
  #mob{display:flex}
  #cta{height:calc(100vh - var(--nav) - 46px)}
}
</style>
</head>
<body>
<div id="app">

<!-- NAV -->
<nav id="nav">
  <div class="n-logo">CD</div>
  <div class="n-lnk">
    <a onclick="nv(this)">Dashboard</a>
    <a onclick="nv(this)">Markets</a>
    <a class="on" onclick="nv(this)">Trade</a>
    <a onclick="nv(this)">Account</a>
  </div>
  <div class="n-r">
    <span>🔔</span>
    <div style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <div class="nav-av"></div><span>Profile ▾</span>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div id="main">

<!-- WATCHLIST -->
<div id="wl">
  <div id="wl-hd"><span>My Watchlist ▾</span><button>‹</button></div>
  <div id="wl-sc"><input type="text" placeholder="Search" oninput="fWL(this.value)"/></div>
  <div id="wl-ch"><span>Asset</span><span>Change</span></div>
  <div id="wl-ls"></div>
</div>

<!-- CHART AREA -->
<div id="cta">
  <div id="ct-hd">
    <span id="pbadge">GLM 5.2</span>
    <span id="ppill">—</span>
    <div id="ohlcv">
      <span>O:<b id="co" class="g">—</b></span>
      <span>H:<b id="ch" class="g">—</b></span>
      <span>L:<b id="cl" class="r">—</b></span>
      <span>C:<b id="cc" class="g">—</b></span>
    </div>
    <div id="ct-hdr">
      <div id="live"><span id="ldot"></span><span id="ltxt">CONNECTING</span></div>
      <button class="btb on" onclick="setBT(this,'depth')">Depth</button>
      <button class="btb" onclick="setBT(this,'order')">Order</button>
      <button class="btb" onclick="setBT(this,'asks')">Asks</button>
    </div>
  </div>

  <div id="ctb">
    <!-- Drawing tools -->
    <div id="dt">
      <button class="db on">╋</button>
      <button class="db">↖</button>
      <div class="dsep"></div>
      <button class="db">╱</button>
      <button class="db">→</button>
      <button class="db">─</button>
      <button class="db">│</button>
      <div class="dsep"></div>
      <button class="db">▭</button>
      <button class="db">△</button>
      <button class="db">○</button>
      <div class="dsep"></div>
      <button class="db">ψ</button>
      <button class="db">⑂</button>
      <div class="dsep"></div>
      <button class="db">T</button>
      <button class="db">⊕</button>
      <div class="dsep"></div>
      <button class="db" style="margin-top:auto">🗑</button>
    </div>

    <!-- Charts container -->
    <div id="cw">
      <div id="mc"></div>
      <div id="rsic"><span id="rsil">RSI(14)</span></div>
    </div>
  </div>

  <div id="tfb">
    <span class="tf" onclick="setTF('1D',this)">1D</span>
    <span class="tf on" onclick="setTF('5D',this)">5D</span>
    <span class="tf" onclick="setTF('1M',this)">1M</span>
    <span class="tf" onclick="setTF('6M',this)">6M</span>
    <span class="tf" onclick="setTF('YTD',this)">YTD</span>
    <span class="tf" onclick="setTF('1Y',this)">1Y</span>
    <span class="tf" onclick="setTF('All',this)">All</span>
    <span id="tfts"></span>
  </div>
</div>

<!-- ORDER BOOK -->
<div id="ob">
  <div id="ob-tabs">
    <button class="ot on" onclick="setOT('dep',this)">Depth</button>
    <button class="ot" onclick="setOT('ord',this)">Order</button>
    <button class="ot" onclick="setOT('ask',this)">Asks</button>
  </div>

  <div id="ob-dep">
    <div class="ob-ch"><span>Bids</span><span>Vol</span></div>
    <div id="ob-al"></div>
    <div id="ob-mid">
      <span id="oblp" class="g">—</span>
      <span style="font-size:8px;color:var(--t2);margin-left:4px">LAST</span>
    </div>
    <div id="ob-bl"></div>
  </div>

  <div id="ob-ord" style="display:flex">
    <div style="display:flex;gap:3px;margin-bottom:8px">
      <button class="oe-s buy-a" id="bb" onclick="setSide('buy')">BUY</button>
      <button class="oe-s" id="sb" onclick="setSide('sell')">SELL</button>
    </div>
    <div>
      <label class="oe-lbl">Order Type</label>
      <select id="otp" class="oe-inp" onchange="calcOE()">
        <option>Limit</option><option>Market</option><option>Stop Limit</option>
      </select>
    </div>
    <div id="pf">
      <label class="oe-lbl">Price (USDT)</label>
      <input type="number" id="oep" class="oe-inp" placeholder="0.00" oninput="calcOE()"/>

    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <div style="font-size:10px;color:var(--t2);margin-bottom:3px">Balance</div>
      <div id="oebal" style="font-size:14px;font-weight:700">$10,000.00</div>
    </div>
    <div id="oepos"></div>
  </div>

  <div id="ob-ask">
    <div class="ob-ch"><span>Price</span><span>Vol</span></div>
    <div id="ob-akl" style="flex:1;overflow:auto"></div>
  </div>
</div>

</div><!-- /main -->

<!-- MOBILE -->
<div id="mob">
  <button class="mbt on" onclick="mTab('chart',this)">📊 Chart</button>
  <button class="mbt" onclick="mTab('watch',this)">👁 Watch</button>
  <button class="mbt" onclick="mTab('book',this)">📋 Depth</button>
  <button class="mbt" onclick="mTab('order',this)">⚡ Order</button>
</div>

<script>
/* ═══════════════════════════════════════════════ */
const SYMS=[
  {id:"btcusdt",sh:"BTC-USD",nm:"BTC/USDT",base:"BTC",full:"Bitcoin"},
  {id:"ethusdt",sh:"ETH-USD",nm:"ETH/USDT",base:"ETH",full:"Ethereum"},
  {id:"bnbusdt",sh:"BNB-USD",nm:"BNB/USDT",base:"BNB",full:"BNB Chain"},
  {id:"solusdt",sh:"SOL-USD",nm:"SOL/USDT",base:"SOL",full:"Solana"},
  {id:"adausdt",sh:"ADA-USD",nm:"ADA/USDT",base:"ADA",full:"Cardano"},
  {id:"xrpusdt",sh:"XRP-USD",nm:"XRP/USDT",base:"XRP",full:"XRP Ledger"},
  {id:"dogeusdt",sh:"DOGE-USD",nm:"DOGE/USDT",base:"DOGE",full:"Dogecoin"},
  {id:"avaxusdt",sh:"AVAX-USD",nm:"AVAX/USDT",base:"AVAX",full:"Avalanche"},
];
const TF_MAP={
  "1D":{iv:"1m",lim:1440},"5D":{iv:"5m",lim:1000},
  "1M":{iv:"1h",lim:720},"6M":{iv:"4h",lim:1080},
  "YTD":{iv:"1d",lim:365},"1Y":{iv:"1d",lim:365},"All":{iv:"1w",lim:260}
};

let selIdx=0, curTF="5D", fSide="buy";
let tickers={}, klines=[], book={bids:[],asks:[]};
let port={balance:10000,positions:[],orders:[]};
let MC=null,CAND=null,VOL=null,RC=null,RSI_S=null;
let wsT=null,wsD=null,wsTr=null;

const sym=()=>SYMS[selIdx];
const fn=(n=0,d=2)=>(+n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const fp=p=>{if(!p&&p!==0)return"—";if(p>=1000)return fn(p,2);if(p>=1)return fn(p,4);return fn(p,6);};
const $=id=>document.getElementById(id);

/* ── CHART SIZING ─────────────────── */
function sizeCharts(){
  const cw=$('cw');
  const w=cw.offsetWidth, h=cw.offsetHeight;
  if(!w||!h)return{w:0,mcH:0,rH:0};
  const mcH=Math.round(h*0.70);
  const rH=h-mcH-1;
  $('mc').style.height=mcH+'px';
  $('rsic').style.height=rH+'px';
  $('rsic').style.top=mcH+'px';
  return{w,mcH,rH};
}

/* ── INIT CHARTS ──────────────────── */
function initCharts(){
  const{w,mcH,rH}=sizeCharts();
  if(!w||!window.LightweightCharts){
    setTimeout(initCharts,300);return;
  }
  const LC=LightweightCharts;
  const baseOpts={
    layout:{background:{color:'#0e1117'},textColor:'#6b7a9a'},
    grid:{vertLines:{color:'#161f2e'},horzLines:{color:'#161f2e'}},
    crosshair:{mode:LC.CrosshairMode.Normal,
      vertLine:{color:'#334466',labelBackgroundColor:'#1b2030'},
      horzLine:{color:'#334466',labelBackgroundColor:'#1b2030'}},
    rightPriceScale:{borderColor:'#232b3e'},
    timeScale:{borderColor:'#232b3e',timeVisible:true,secondsVisible:false},
    handleScroll:true,handleScale:true,
  };

  MC=LC.createChart($('mc'),{...baseOpts,width:w,height:mcH,
    timeScale:{...baseOpts.timeScale,visible:false}});
  CAND=MC.addCandlestickSeries({
    upColor:'#26a69a',downColor:'#ef5350',
    borderUpColor:'#26a69a',borderDownColor:'#ef5350',
    wickUpColor:'#26a69a',wickDownColor:'#ef5350',
  });
  VOL=MC.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});
  MC.priceScale('vol').applyOptions({scaleMargins:{top:.75,bottom:0}});

  RC=LC.createChart($('rsic'),{...baseOpts,width:w,height:rH,
    rightPriceScale:{...baseOpts.rightPriceScale,scaleMargins:{top:.1,bottom:.1}}});
  RSI_S=RC.addLineSeries({color:'#ce93d8',lineWidth:1,priceLineVisible:false,lastValueVisible:true});
  window._r70=RC.addLineSeries({color:'rgba(239,83,80,.3)',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});
  window._r30=RC.addLineSeries({color:'rgba(38,166,154,.3)',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});

  // Sync scroll/scale
  let lk=false;
  MC.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(lk||!r)return;lk=true;RC.timeScale().setVisibleLogicalRange(r);lk=false;});
  RC.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(lk||!r)return;lk=true;MC.timeScale().setVisibleLogicalRange(r);lk=false;});

  // Crosshair → update OHLCV header
  MC.subscribeCrosshairMove(p=>{
    const c=p.seriesData&&p.seriesData.get(CAND);
    if(!c)return;
    const up=c.close>=c.open;
    $('co').textContent=fp(c.open);$('co').className=up?'g':'r';
    $('ch').textContent=fp(c.high);
    $('cl').textContent=fp(c.low);
    $('cc').textContent=fp(c.close);$('cc').className=up?'g':'r';
    try{RC.setCrosshairPosition(0,p.time,RSI_S);}catch(e){}
  });

  loadKlines();
}

/* ── RSI ──────────────────────────── */
function calcRSI(d,p=14){
  const r=[];if(d.length<p+2)return r;
  let ag=0,al=0;
  for(let i=1;i<=p;i++){const x=d[i].close-d[i-1].close;x>0?ag+=x:al-=x;}
  ag/=p;al/=p;
  for(let i=p+1;i<d.length;i++){
    const x=d[i].close-d[i-1].close;
    ag=(ag*(p-1)+(x>0?x:0))/p;al=(al*(p-1)+(x<0?-x:0))/p;
    r.push({time:d[i].time,value:Math.round((100-100/(1+ag/(al||.0001)))*100)/100});
  }
  return r;
}

/* ── LOAD KLINES ──────────────────── */
async function loadKlines(){
  const{iv,lim}=TF_MAP[curTF]||{iv:'5m',lim:500};
  try{
    const res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym().id.toUpperCase()}&interval=${iv}&limit=${Math.min(lim,1000)}`);
    const raw=await res.json();
    if(!Array.isArray(raw)||!CAND)return;
    const candles=raw.map(k=>({time:Math.floor(+k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
    const vols=candles.map(k=>({time:k.time,value:k.volume,color:k.close>=k.open?'rgba(38,166,154,.35)':'rgba(239,83,80,.35)'}));
    const rsi=calcRSI(candles);
    CAND.setData(candles);VOL.setData(vols);RSI_S.setData(rsi);
    if(rsi.length>1){
      const t0=rsi[0].time,t1=rsi[rsi.length-1].time;
      _r70.setData([{time:t0,value:70},{time:t1,value:70}]);
      _r30.setData([{time:t0,value:30},{time:t1,value:30}]);
      $('rsil').textContent=`RSI(14)  ${rsi[rsi.length-1]?.value?.toFixed(2)||''}`;
    }
    MC.timeScale().fitContent();RC.timeScale().fitContent();
    klines=candles;
    const l=candles[candles.length-1];
    if(l){const up=l.close>=l.open;$('co').textContent=fp(l.open);$('co').className=up?'g':'r';$('ch').textContent=fp(l.high);$('cl').textContent=fp(l.low);$('cc').textContent=fp(l.close);$('cc').className=up?'g':'r';}
    // Redraw mini sparkline for selected symbol
    drawMini(sym());
  }catch(e){console.error('klines:',e);}
}

/* ── WEBSOCKET: tickers ───────────── */
function connT(){
  const streams=SYMS.map(s=>`${s.id}@ticker`).join('/');
  wsT=new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);
  wsT.onopen=()=>{$('ldot').style.background='#26a69a';$('ltxt').textContent='LIVE';$('ltxt').style.color='#26a69a';};
  wsT.onclose=wsT.onerror=()=>{$('ldot').style.background='#3a4560';$('ltxt').textContent='RECONNECT';$('ltxt').style.color='#3a4560';setTimeout(connT,3000);};
  wsT.onmessage=({data})=>{
    const{data:d}=JSON.parse(data);if(!d)return;
    const k=d.s.toLowerCase();
    tickers[k]={price:+d.c,change:+d.P,high:+d.h,low:+d.l,vol:+d.v,open:+d.o};
    renderWL();
    if(k===sym().id){
      const up=(+d.P)>=0;
      $('oblp').textContent=fp(+d.c);$('oblp').className=up?'g':'r';
      $('ppill').textContent=fp(+d.c);
      try{CAND&&CAND.update({time:Math.floor(+d.T/1000),open:+d.o,high:+d.h,low:+d.l,close:+d.c});}catch(e){}
    }
  };
}
function connD(){
  wsD&&wsD.close();
  wsD=new WebSocket(`wss://stream.binance.com:9443/ws/${sym().id}@depth20@100ms`);
  wsD.onmessage=({data})=>{
    const d=JSON.parse(data);
    book.bids=(d.bids||[]).slice(0,16).map(([p,q])=>({p:+p,q:+q}));
    book.asks=(d.asks||[]).slice(0,16).map(([p,q])=>({p:+p,q:+q}));
    renderBook();
  };
}
function connTr(){
  wsTr&&wsTr.close();
  wsTr=new WebSocket(`wss://stream.binance.com:9443/ws/${sym().id}@trade`);
}

/* ── RENDER WATCHLIST ─────────────── */
function renderWL(filter=''){
  const items=filter?SYMS.filter(s=>s.sh.toLowerCase().includes(filter.toLowerCase())||s.full.toLowerCase().includes(filter.toLowerCase())):SYMS;
  $('wl-ls').innerHTML=items.map(s=>{
    const i=SYMS.indexOf(s),tk=tickers[s.id]||{},up=(tk.change||0)>=0,on=i===selIdx;
    return`<div class="wi${on?' on':''}" onclick="selSym(${i})">
      <div class="wi-inf"><div class="wi-s">${s.sh}</div><div class="wi-n">${s.full}</div></div>
      <div class="wi-mn"><canvas id="mn-${s.id}" width="60" height="30" style="display:block"></canvas></div>
      <div class="wi-pr">
        <div class="wi-pv" style="color:${tk.price?(up?'#26a69a':'#ef5350'):'#3a4560'}">${fp(tk.price)}</div>
        <div class="wi-cv" style="color:${up?'#26a69a':'#ef5350'}">${up?'+':''}${fn(tk.change||0,2)}%</div>
      </div>
    </div>`;
  }).join('');
  SYMS.forEach(s=>drawMini(s));
}
function drawMini(s){
  const cv=document.getElementById(`mn-${s.id}`);if(!cv)return;
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,60,30);
  const tk=tickers[s.id]||{},up=(tk.change||0)>=0,col=up?'#26a69a':'#ef5350';
  ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=1.5;
  if(s.id===sym().id&&klines.length>1){
    const pts=klines.slice(-22);
    const mn=Math.min(...pts.map(k=>k.close)),mx=Math.max(...pts.map(k=>k.close)),rng=mx-mn||1;
    pts.forEach((k,i)=>{const x=i*(60/(pts.length-1)),y=26-((k.close-mn)/rng)*22;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  } else {
    const chg=tk.change||0,seed=s.id.charCodeAt(0)*.03;
    for(let i=0;i<21;i++){
      const x=i*3,y=15+Math.sin(i*.6+seed)*4+(up?-i*.05:i*.05)+Math.sin(i*1.3+seed)*2;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
  }
  ctx.stroke();
}
function fWL(v){renderWL(v);}

/* ── RENDER BOOK ──────────────────── */
function renderBook(){
  const mA=Math.max(...book.asks.map(a=>a.q),1),mB=Math.max(...book.bids.map(b=>b.q),1);
  $('ob-al').innerHTML=[...book.asks].reverse().map(a=>`<div class="ob-r"><div class="ob-bg" style="background:#ef5350;width:${(a.q/mA)*100}%"></div><span class="ob-p r">${fp(a.p)}</span><span class="ob-q">${fn(a.q,3)}</span></div>`).join('');
  $('ob-bl').innerHTML=book.bids.map(b=>`<div class="ob-r"><div class="ob-bg" style="background:#26a69a;width:${(b.q/mB)*100}%"></div><span class="ob-p g">${fp(b.p)}</span><span class="ob-q">${fn(b.q,3)}</span></div>`).join('');
  if($('ob-akl'))$('ob-akl').innerHTML=book.asks.map(a=>`<div class="ob-r" style="padding:2px 8px"><span class="ob-p r">${fp(a.p)}</span><span class="ob-q">${fn(a.q,3)}</span></div>`).join('');
}

/* ── ACTIONS ──────────────────────── */
function selSym(i){
  selIdx=i;klines=[];
  const s=sym();
  $('pbadge').textContent=s.sh;
  $('oeal').textContent=`Amount (${s.base})`;
  $('oesub').textContent=`${fSide==='buy'?'▲ BUY':'▼ SELL'} ${s.base}`;
  connD();connTr();loadKlines();renderWL();
}
function setTF(tf,el){
  curTF=tf;
  document.querySelectorAll('.tf').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');loadKlines();
}
function setBT(el){
  document.querySelectorAll('.btb').forEach(b=>b.classList.remove('on'));el.classList.add('on');
}
function setOT(t,el){
  document.querySelectorAll('.ot').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  $('ob-dep').style.display=t==='dep'?'flex':'none';
  $('ob-ord').style.display=t==='ord'?'flex':'none';
  $('ob-ask').style.display=t==='ask'?'flex':'none';
}
function setSide(s){
  fSide=s;
  $('bb').className='oe-s'+(s==='buy'?' buy-a':'');
  $('sb').className='oe-s'+(s==='sell'?' sel-a':'');
  $('oesub').style.background=s==='buy'?'#26a69a':'#ef5350';
  $('oesub').style.color=s==='buy'?'#000':'#fff';
  $('oesub').textContent=`${s==='buy'?'▲ BUY':'▼ SELL'} ${sym().base}`;
}
function calcOE(){
  const tp=$('otp').value,p=tp==='Market'?(tickers[sym().id]?.price||0):+(($('oep').value)||0),a=+($('oea').value||0);
  $('oetot').textContent=(p&&a)?`Total ≈ $${fn(p*a)}`:'';
}
function placeOrd(){
  const tp=$('otp').value,p=tp==='Market'?(tickers[sym().id]?.price||0):+(($('oep').value)||0),a=+($('oea').value||0);
  if(!p||!a||a<=0)return;
  const tot=p*a,s=sym();
  if(fSide==='buy'&&tot>port.balance){alert('Saldo tidak cukup');return;}
  port.balance+=fSide==='buy'?-tot:tot;
  const idx=port.positions.findIndex(x=>x.sym===s.nm);
  if(fSide==='buy'){if(idx>=0){const nq=port.positions[idx].qty+a;port.positions[idx]={...port.positions[idx],qty:nq,avg:(port.positions[idx].avg*port.positions[idx].qty+p*a)/nq};}else port.positions.push({sym:s.nm,base:s.base,qty:a,avg:p});}
  else if(idx>=0){const nq=port.positions[idx].qty-a;if(nq<=.000001)port.positions.splice(idx,1);else port.positions[idx].qty=nq;}
  port.orders.unshift({sym:s.nm,side:fSide,price:p,qty:a,tot,at:new Date().toLocaleTimeString()});
  if(port.orders.length>20)port.orders.length=20;
  $('oebal').textContent='$'+fn(port.balance);
  $('oep').value='';$('oea').value='';$('oetot').textContent='';
  renderPos();
}
function renderPos(){
  $('oepos').innerHTML=port.positions.map(pos=>{
    const tk=tickers[SYMS.find(x=>x.nm===pos.sym)?.id]||{};
    const pp=tk.price?(tk.price-pos.avg)*pos.qty:0;
    return`<div style="padding:7px;background:var(--surf);border:1px solid var(--border);border-radius:3px;margin-top:6px">
      <div style="display:flex;justify-content:space-between;margin-bottom:2px">
        <span style="font-weight:600;font-size:11px">${pos.sym}</span>
        <span style="font-size:11px;color:${pp>=0?'#26a69a':'#ef5350'};font-weight:600">${pp>=0?'+':''}$${fn(pp)}</span>
      </div>
      <div style="font-size:10px;color:var(--t2)">${pos.qty.toFixed(5)} @ ${fp(pos.avg)}</div>
    </div>`;
  }).join('');
}
function nv(a){document.querySelectorAll('.n-lnk a').forEach(x=>x.classList.remove('on'));a.classList.add('on');}
function mTab(t,el){
  document.querySelectorAll('.mbt').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  $('cta').style.display=t==='chart'?'flex':'none';
  $('wl').style.display=t==='watch'?'flex':'none';
  $('ob').style.display=(t==='book'||t==='order')?'flex':'none';
  if(t==='book')setOT('dep',document.querySelectorAll('.ot')[0]);
  if(t==='order')setOT('ord',document.querySelectorAll('.ot')[1]);
  if(t==='chart'){sizeCharts();MC&&MC.timeScale().fitContent();}
}

/* ── CLOCK ────────────────────────── */
function tick(){const d=new Date();$('tfts').textContent=d.toLocaleTimeString()+' ('+d.toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})+')';}

/* ── INIT ─────────────────────────── */
function init(){
  // Default: depth tab visible, order hidden
  $('ob-dep').style.display='flex';
  $('ob-ord').style.display='none';
  $('ob-ask').style.display='none';

  renderWL();
  setTimeout(()=>{
    initCharts();
    connT();connD();connTr();
    window.setInterval(loadKlines,60000);
    window.setInterval(tick,1000);tick();
  },150);
}

window.addEventListener('resize',()=>{
  const{w,mcH,rH}=sizeCharts();
  if(MC&&w)MC.resize(w,mcH);
  if(RC&&w)RC.resize(w,rH);
});

document.addEventListener('DOMContentLoaded',init);
</script>
